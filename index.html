<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2412B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AZT Mobiliteitsapp">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AZT Mobiliteitsapp</title>
<meta name="description" content="Te voet, met de fiets of met de auto: test je kennis van de wegcode en verkeersveiligheid in een korte quiz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: één smalle kolom zoals een fietspad, met een gestreepte middenlijn als voortgangsbalk */
:root {
  --bg: #F3F4EF;          /* licht beton */
  --surface: #FFFFFF;
  --ink: #17201E;         /* asfalt */
  --muted: #5B6662;
  --line: #D9DDD3;
  --lane: #C2412B;        /* rood fietspad */
  --lane-soft: #F6DDD6;
  --sign: #1F56A6;        /* blauw verkeersbord */
  --sign-soft: #DCE6F5;
  --signal: #F2C230;      /* signaalgeel */
  --ok: #1E7A4C;
  --ok-soft: #DAF0E3;
  --bad: #B3261E;
  --bad-soft: #F9DEDC;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --surface: #1C2422; --ink: #EEF1EC; --muted: #A3ADA8; --line: #2F3A37;
    --lane: #E5654C; --lane-soft: #3A211C; --sign: #7FA8EA; --sign-soft: #1B2A42; --signal: #F2C230;
    --ok: #5BC48C; --ok-soft: #173326; --bad: #F08A80; --bad-soft: #3D1D1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1C2422; --ink: #EEF1EC; --muted: #A3ADA8; --line: #2F3A37;
  --lane: #E5654C; --lane-soft: #3A211C; --sign: #7FA8EA; --sign-soft: #1B2A42; --signal: #F2C230;
  --ok: #5BC48C; --ok-soft: #173326; --bad: #F08A80; --bad-soft: #3D1D1A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--sign); outline-offset: 3px; }

/* kop */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 6px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-stretch: 85%; letter-spacing: .02em; text-transform: uppercase; font-size: 15px; line-height: 1.1; min-width: 0; flex: 1 1 auto; }
.brand .name { min-width: 0; overflow-wrap: anywhere; }
.brand .dot { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--sign); display: grid; place-items: center; }
.brand .dot svg { width: 18px; height: 18px; }
.back { white-space: nowrap; border: 0; background: transparent; padding: 8px 4px; color: var(--muted); cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.back:hover { color: var(--ink); }

/* hero */
.hero { padding-block: 18px 22px; }
.eyebrow { font-family: var(--font-display); font-weight: 700; font-stretch: 100%; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--lane); }
h1 { font-family: var(--font-display); font-weight: 900; font-stretch: 72%; text-transform: uppercase; line-height: .92; font-size: clamp(48px, 15vw, 76px); margin: 8px 0 14px; letter-spacing: -.01em; text-wrap: balance; }
h1 .hl { color: var(--lane); }
.lede { color: var(--muted); margin: 0; max-width: 44ch; }

/* fietspad-streep */
.lane-rule { height: 10px; border-radius: 3px; background: var(--lane); position: relative; overflow: hidden; margin-block: 6px 22px; }
.lane-rule::after { content: ""; position: absolute; inset: 4px 0 auto; height: 2px; background: repeating-linear-gradient(90deg, var(--bg) 0 14px, transparent 14px 26px); }

/* voertuigkeuze */
.pick-label { font-family: var(--font-display); font-weight: 800; font-stretch: 90%; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; margin: 0 0 10px; }
.vehicles { display: grid; gap: 10px; }
.vehicle {
  display: grid; grid-template-columns: 84px 1fr auto; align-items: center; gap: 14px;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px 12px 10px;
  transition: border-color .15s, transform .15s;
}
.vehicle:hover { border-color: var(--ink); transform: translateX(3px); }
.vehicle .ico { width: 84px; height: 52px; border-radius: 10px; background: var(--sign-soft); color: var(--sign); display: grid; place-items: center; }
.vehicle .ico svg { width: 70px; height: 42px; }
.vehicle .name { font-family: var(--font-display); font-weight: 800; font-stretch: 85%; font-size: 21px; line-height: 1.1; text-transform: uppercase; display: block; }
.vehicle .sub { color: var(--muted); font-size: 14px; display: block; margin-top: 2px; }
.vehicle .go { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.vehicle .go svg { width: 16px; height: 16px; }
.vehicle .meta { min-width: 0; }
.install-btn { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--lane); background: transparent; color: var(--lane); cursor: pointer; border-radius: 999px; padding: 5px 11px 5px 8px; font-family: var(--font-display); font-weight: 800; font-stretch: 90%; text-transform: uppercase; letter-spacing: .04em; font-size: 12px; white-space: nowrap; flex: none; }
@media (hover: hover) { .install-btn:hover { background: var(--lane); color: var(--surface); } }
.install-btn:active { background: var(--lane); color: var(--surface); }
.install-btn svg { width: 15px; height: 15px; }
.ios-hint { margin-top: 4px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 2px dashed var(--line); font-size: 15px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.ios-hint button { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 0 4px; }
.modes { display: grid; gap: 12px; }
.mode { grid-template-columns: 96px 1fr auto; padding-block: 16px; }
.mode .ico { width: 96px; height: 64px; }
.mode .ico svg { width: 80px; height: 48px; }
.mode .name { font-size: 26px; }
.mode.m-voet .ico { background: var(--ok-soft); color: var(--ok); }
.mode.m-fiets .ico { background: var(--lane-soft); color: var(--lane); }
.foot { color: var(--muted); font-size: 13px; margin-top: 26px; }
.foot a { color: inherit; }

/* quiz */
.qhead { display: flex; align-items: center; gap: 12px; padding-block: 12px 4px; }
.qhead .ico { width: 64px; height: 40px; color: var(--sign); flex: none; }
.qhead .ico svg { width: 64px; height: 40px; }
.qhead .t { font-family: var(--font-display); font-weight: 800; font-stretch: 85%; text-transform: uppercase; font-size: 20px; line-height: 1.1; }
.qhead .c { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.progress { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; margin-block: 14px 22px; }
.progress span { height: 8px; border-radius: 2px; background: var(--line); transition: background .25s; }
.progress span.done { background: var(--lane); }
.progress span.now { background: var(--signal); }
.tag { display: inline-block; font-family: var(--font-display); font-weight: 700; font-stretch: 100%; text-transform: uppercase; letter-spacing: .1em; font-size: 11px; padding: 4px 8px; border-radius: 4px; margin-bottom: 10px; background: var(--sign-soft); color: var(--sign); }
.tag.wegcode { background: var(--lane-soft); color: var(--lane); }
.tag.veiligheid { background: var(--ok-soft); color: var(--ok); }
.question { font-family: var(--font-display); font-weight: 800; font-stretch: 90%; font-size: clamp(24px, 6.4vw, 30px); line-height: 1.15; margin: 0 0 18px; text-wrap: balance; }
.answers { display: grid; gap: 10px; }
.answer {
  display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center;
  width: 100%; text-align: left; cursor: pointer; font-size: 17px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px;
  transition: border-color .15s, background .15s;
}
.answer:hover:not(:disabled) { border-color: var(--ink); }
.answer .k { width: 34px; height: 34px; border-radius: 8px; background: var(--bg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; }
.answer:disabled { cursor: default; }
.answer.right { border-color: var(--ok); background: var(--ok-soft); }
.answer.right .k { background: var(--ok); color: var(--surface); }
.answer.wrong { border-color: var(--bad); background: var(--bad-soft); }
.answer.wrong .k { background: var(--bad); color: var(--surface); }
.answer.dim { opacity: .55; }
.explain { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--sign-soft); border-left: 6px solid var(--sign); }
.explain strong { display: block; font-family: var(--font-display); font-stretch: 90%; text-transform: uppercase; letter-spacing: .04em; font-size: 14px; margin-bottom: 4px; }
.explain p { margin: 0; }
.cta {
  margin-top: 18px; width: 100%; border: 0; cursor: pointer; border-radius: 12px; padding: 16px 18px;
  background: var(--ink); color: var(--bg); font-family: var(--font-display); font-weight: 800; font-stretch: 90%;
  text-transform: uppercase; letter-spacing: .05em; font-size: 17px; display: flex; justify-content: space-between; align-items: center;
}
.cta.alt { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.cta svg { width: 18px; height: 18px; }

/* resultaat */
.result { padding-block: 10px 0; }
.score { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 10px; }
.score .n { font-family: var(--font-display); font-weight: 900; font-stretch: 70%; font-size: 120px; line-height: .85; color: var(--lane); font-variant-numeric: tabular-nums; }
.score .of { font-family: var(--font-display); font-weight: 800; font-stretch: 80%; font-size: 34px; color: var(--muted); }
.verdict { font-family: var(--font-display); font-weight: 900; font-stretch: 80%; text-transform: uppercase; font-size: 30px; line-height: 1; margin: 0 0 10px; }
.tipbox { margin-top: 18px; padding: 16px; border-radius: 12px; background: var(--surface); border: 2px dashed var(--line); }
.tipbox .eyebrow { color: var(--sign); }
.tipbox p { margin: 6px 0 0; }
.outro { margin-top: 22px; padding: 18px 16px; border-radius: 12px; background: var(--surface); border: 2px solid var(--ink); }
.outro .eyebrow { color: var(--lane); }
.outro p { margin: 8px 0 0; }
.outro ul { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.review { margin-top: 22px; display: grid; gap: 8px; }
.review div { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 15px; color: var(--muted); }
.review b { color: var(--ink); font-weight: 700; }
.mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--surface); }
.mark.y { background: var(--ok); } .mark.n { background: var(--bad); }
.copied { font-size: 14px; color: var(--ok); margin-top: 8px; min-height: 1.4em; }

.screen { animation: in .35s ease both; }
@keyframes in { from { transform: translateY(8px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .vehicle, .vehicle:hover { transition: none; transform: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l2 7"/></svg></span>
      <span class="name">AZT Mobiliteitsapp</span>
    </div>
    <button class="install-btn" id="installBtn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Installeer app
    </button>
    <button class="back" id="backBtn" hidden >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span id="backLabel">Terug</span>
    </button>
  </header>
  <div class="ios-hint" id="iosHint" hidden role="status"><span>Tik onderaan in Safari op het deelicoon en kies <strong>Zet op beginscherm</strong>.</span><button id="iosClose" aria-label="Sluiten">×</button></div>
  <main id="app"></main>
</div>

<script>
const ICONS = {
  fiets: `<svg viewBox="0 0 70 42" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="28" r="10"/><circle cx="56" cy="28" r="10"/><path d="M14 28l12-15h18l12 15M26 13l8 15H14M34 28l10-15M44 13l-2-6h6M22 9h8"/></svg>`,
  ebike: `<svg viewBox="0 0 70 42" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="28" r="10"/><circle cx="56" cy="28" r="10"/><path d="M14 28l12-15h18l12 15M26 13l8 15H14M34 28l10-15M44 13l-2-6h6M22 9h8"/><path d="M33 15l-3 6h5l-3 6" stroke-width="2.4"/></svg>`,
  speed: `<svg viewBox="0 0 70 42" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="28" r="10"/><circle cx="58" cy="28" r="10"/><path d="M20 28l11-15h16l11 15M31 13l7 15H20M38 28l9-15M47 13l-2-6h6M28 9h7"/><path d="M2 14h10M4 21h7M2 28h5" stroke-width="2.4"/></svg>`,
  bakfiets: `<svg viewBox="0 0 70 42" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="32" r="7"/><circle cx="58" cy="28" r="10"/><path d="M3 14h22l-3 12H6z"/><path d="M22 26l8 6h10l18-4M40 32l6-17h-6M46 15l3-7h5M36 11h8"/></svg>`,
  voet: `<svg viewBox="0 0 70 42" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="36" cy="6" r="4"/><path d="M35 12l-3 13-6 12M32 25l6 5 2 8M34 15l-7 7M34 15l7 5"/></svg>`,
  auto: `<svg viewBox="0 0 70 42" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 30H5v-8l4-3 9-2 7-8h20l9 8 7 2 2 3v8h-5M24 30h22"/><circle cx="17" cy="30" r="6"/><circle cx="53" cy="30" r="6"/><path d="M26 17h26M38 9v8"/></svg>`,
  longtail: `<svg viewBox="0 0 70 42" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="28" r="9"/><circle cx="59" cy="28" r="9"/><path d="M59 28L50 14H30M30 14l-8 14h14l14-14M30 14l-3-7M24 7h7M11 28l11-16M50 14h16M52 20v-6M62 20v-6"/><path d="M50 9h14" stroke-width="4"/></svg>`
};
const ARROW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

// De vragen staan in vragen.json, zodat ze aangepast en geroteerd kunnen worden zonder deze pagina te wijzigen.
let VEHICLES = {};
let SETTINGS = { modus: "vast", aantal: 10 };
let OUTROS = {};

async function loadQuestions() {
  const res = await fetch("vragen.json", { cache: "no-cache" });
  if (!res.ok) throw new Error("vragen.json: " + res.status);
  const data = await res.json();
  OUTROS = data.afsluiters || {};
  SETTINGS = { modus: data.modus === "willekeurig" ? "willekeurig" : "vast", aantal: data.aantal || 10 };
  for (const [id, v] of Object.entries(data.quizzen)) {
    VEHICLES[id] = {
      name: v.naam, sub: v.uitleg, tip: v.tip, mode: !v.fietstype,
      all: v.vragen.map(q => ({ actief: q.actief !== false, t: q.soort, q: q.vraag, a: q.antwoorden, c: q.juist, x: q.uitleg }))
    };
  }
}

function shuffled(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function pickQuestions(v) {
  if (SETTINGS.modus === "willekeurig") return shuffled(v.all).slice(0, SETTINGS.aantal);
  const active = v.all.filter(q => q.actief);
  return (active.length ? active : v.all).slice(0, SETTINGS.aantal);
}

const app = document.getElementById("app");
const backBtn = document.getElementById("backBtn");
let state = null;

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

let screen = "home";

function vehicleCard(id, extra = "") {
  const v = VEHICLES[id] || MODES[id];
  return `
          <button class="vehicle ${extra}" data-id="${id}">
            <span class="ico" aria-hidden="true">${ICONS[id === "fietsen" ? "fiets" : id]}</span>
            <span class="meta"><span class="name">${v.name}</span><span class="sub">${v.sub}</span></span>
            <span class="go" aria-hidden="true">${ARROW}</span>
          </button>`;
}
const MODES = { fietsen: { name: "Met de fiets", sub: "Fiets, e-bike, speed pedelec, bakfiets of longtail" } };
const BIKES = ["fiets", "ebike", "speed", "bakfiets", "longtail"];

function renderHome() {
  state = null;
  screen = "home";
  backBtn.hidden = true;
  app.innerHTML = `
    <section class="screen">
      <div class="hero">
        <div class="eyebrow">Mobiliteitsactie</div>
        <h1>Hoe <span class="hl">verkeersfit</span> ben jij?</h1>
        <p class="lede">Hoe kom jij naar het werk? Kies hieronder en test in tien vragen hoe goed je de wegcode en de risico's onderweg kent.</p>
      </div>
      <div class="lane-rule" aria-hidden="true"></div>
      <p class="pick-label">Hoe kom jij naar het werk?</p>
      <div class="vehicles modes">
        ${vehicleCard("voet", "mode m-voet")}
        ${vehicleCard("fietsen", "mode m-fiets")}
        ${vehicleCard("auto", "mode m-auto")}
      </div>
      <p class="foot">Gebaseerd op de Belgische wegcode. Meer info op <a href="https://www.wegcode.be" target="_blank" rel="noopener">wegcode.be</a>.</p>
    </section>`;
  app.querySelectorAll(".vehicle").forEach(b => b.addEventListener("click", () => b.dataset.id === "fietsen" ? showBikes() : start(b.dataset.id)));
  renderInstall();
}

function renderBikes() {
  state = null;
  screen = "bikes";
  backBtn.hidden = false;
  app.innerHTML = `
    <section class="screen">
      <div class="hero">
        <div class="eyebrow">Met de fiets</div>
        <h1>Hoe <span class="hl">fietsfit</span> ben jij?</h1>
        <p class="lede">Kies waarmee je naar hier fietst en test in tien vragen hoe goed je de regels en trucjes voor jouw fiets kent.</p>
      </div>
      <div class="lane-rule" aria-hidden="true"></div>
      <p class="pick-label">Waarmee rijd jij?</p>
      <div class="vehicles">
        ${BIKES.map(id => vehicleCard(id)).join("")}
      </div>
      <p class="foot">Gebaseerd op de Belgische wegcode. Meer info op <a href="https://www.wegcode.be" target="_blank" rel="noopener">wegcode.be</a>.</p>
    </section>`;
  app.querySelectorAll(".vehicle").forEach(b => b.addEventListener("click", () => start(b.dataset.id)));
  renderInstall();
}

function showBikes() {
  try { history.replaceState(null, "", "#fietsen"); } catch (e) {}
  iosHint.hidden = true;
  renderBikes();
  window.scrollTo({ top: 0 });
}

function start(id) {
  state = { id, i: 0, score: 0, answers: [], qs: pickQuestions(VEHICLES[id]) };
  screen = "quiz";
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  backBtn.hidden = false;
  renderInstall();
  iosHint.hidden = true;
  renderQuestion();
  window.scrollTo({ top: 0 });
}

function renderQuestion() {
  const v = VEHICLES[state.id];
  const item = state.qs[state.i];
  const total = state.qs.length;
  // antwoorden in willekeurige volgorde, zodat het juiste antwoord niet altijd op dezelfde plek staat
  state.order = item.a.map((_, k) => k).sort(() => Math.random() - 0.5);
  app.innerHTML = `
    <section class="screen">
      <div class="qhead">
        <span class="ico" aria-hidden="true">${ICONS[state.id]}</span>
        <div><div class="t">${v.name}</div><div class="c">Vraag ${state.i + 1} van ${total}</div></div>
      </div>
      <div class="progress" aria-hidden="true">${state.qs.map((_, k) => `<span class="${k < state.i ? "done" : k === state.i ? "now" : ""}"></span>`).join("")}</div>
      <span class="tag ${item.t || "fiets"}">${item.t === "wegcode" ? "Wegcode" : item.t === "veiligheid" ? "Verkeersveiligheid" : "Jouw " + v.name.toLowerCase()}</span>
      <h2 class="question">${esc(item.q)}</h2>
      <div class="answers">
        ${state.order.map((k, pos) => `<button class="answer" data-k="${k}"><span class="k">${"ABC"[pos]}</span><span>${esc(item.a[k])}</span></button>`).join("")}
      </div>
      <div id="after"></div>
    </section>`;
  app.querySelectorAll(".answer").forEach(b => b.addEventListener("click", () => choose(+b.dataset.k)));
}

function choose(k) {
  const v = VEHICLES[state.id];
  const item = state.qs[state.i];
  const ok = k === item.c;
  if (ok) state.score++;
  state.answers.push(ok);
  app.querySelectorAll(".answer").forEach(b => {
    const idx = +b.dataset.k;
    b.disabled = true;
    if (idx === item.c) b.classList.add("right");
    else if (idx === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const last = state.i === state.qs.length - 1;
  const after = document.getElementById("after");
  after.innerHTML = `
    <div class="explain" role="status"><strong>${ok ? "Juist!" : "Niet helemaal"}</strong><p>${esc(item.x)}</p></div>
    <button class="cta" id="next">${last ? "Bekijk je score" : "Volgende vraag"} ${ARROW}</button>`;
  const next = document.getElementById("next");
  next.addEventListener("click", () => { if (last) renderResult(); else { state.i++; renderQuestion(); } });
  next.focus({ preventScroll: true });
  after.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

function renderResult() {
  const v = VEHICLES[state.id];
  const total = state.qs.length, s = state.score;
  const bike = !v.mode;
  const verdict = s === total ? (bike ? "Fietsfit met glans" : "Verkeersfit met glans") : s >= total - 3 ? "Goed op weg" : (bike ? "Nog wat bijtrappen" : "Nog wat oefenen");
  app.innerHTML = `
    <section class="screen result">
      <div class="eyebrow">${v.name} · jouw score</div>
      <div class="score"><span class="n">${s}</span><span class="of">/ ${total}</span></div>
      <p class="verdict">${verdict}</p>
      <div class="lane-rule" aria-hidden="true"></div>
      <div class="tipbox"><div class="eyebrow">Tip voor onderweg</div><p>${esc(v.tip)}</p></div>
      ${outroHtml(state.id)}
      <div class="review">${state.qs.map((it, k) => `<div><span class="mark ${state.answers[k] ? "y" : "n"}">${state.answers[k] ? "✓" : "✕"}</span><span><b>${esc(it.q)}</b><br>${esc(it.a[it.c])}</span></div>`).join("")}</div>
      <button class="cta" id="again">${bike ? "Probeer een andere fiets" : "Kies een ander vervoermiddel"} ${ARROW}</button>
      <button class="cta alt" id="share">Kopieer link naar deze quiz ${ARROW}</button>
      <div class="copied" id="copied" role="status"></div>
    </section>`;
  window.scrollTo({ top: 0 });
  document.getElementById("again").addEventListener("click", bike ? showBikes : goHome);
  document.getElementById("share").addEventListener("click", () => {
    const url = location.href.split("#")[0] + "#" + state.id;
    const msg = document.getElementById("copied");
    navigator.clipboard.writeText(url).then(() => { msg.textContent = "Link gekopieerd."; }).catch(() => { msg.textContent = url; });
  });
}

function outroHtml(id) {
  const o = OUTROS[id === "voet" || id === "auto" ? id : "fiets"];
  if (!o) return "";
  return `<div class="outro"><div class="eyebrow">Veilig op weg in het donker</div><p>${esc(o.tekst)}</p><ul>${(o.tips || []).map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`;
}

function goHome() {
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  renderHome();
  window.scrollTo({ top: 0 });
}
backBtn.addEventListener("click", () => (screen === "quiz" && !VEHICLES[state.id].mode) ? showBikes() : goHome());

// Installeren als app
let installPrompt = null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
// De installatieknop verschijnt alleen op smartphones en tablets, niet in een browser op de computer.
const isMobile = (navigator.userAgentData && navigator.userAgentData.mobile) || isIOS || /android|mobile/i.test(navigator.userAgent);
const installBtn = document.getElementById("installBtn");
const iosHint = document.getElementById("iosHint");
function renderInstall() {
  installBtn.hidden = standalone || !isMobile || state !== null || !(installPrompt || isIOS);
}
installBtn.addEventListener("click", async () => {
  if (installPrompt) {
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    renderInstall();
  } else {
    iosHint.hidden = !iosHint.hidden;
  }
});
document.getElementById("iosClose").addEventListener("click", () => { iosHint.hidden = true; });
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; renderInstall(); });
window.addEventListener("appinstalled", () => { installPrompt = null; renderInstall(); });
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

const initial = (location.hash || "").slice(1);
app.innerHTML = `<p class="lede" style="padding-block: 40px">Vragen laden…</p>`;
loadQuestions()
  .then(() => { if (VEHICLES[initial]) start(initial); else if (initial === "fietsen") renderBikes(); else renderHome(); })
  .catch(() => { app.innerHTML = `<p class="lede" style="padding-block: 40px">De vragen konden niet geladen worden. Controleer je internetverbinding en vernieuw de pagina.</p>`; });
</script>

</body>
</html>
