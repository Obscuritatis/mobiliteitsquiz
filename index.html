<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Fietsquiz Op Weg</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: één smalle kolom zoals een fietspad, met een gestreepte middenlijn als voortgangsbalk */
:root {
  --bg: #F3F4EF;          /* licht beton */
  --surface: #FFFFFF;
  --ink: #17201E;         /* asfalt */
  --muted: #5B6662;
  --line: #D9DDD3;
  --lane: #C2412B;        /* rood fietspad */
  --lane-soft: #F6DDD6;
  --sign: #1F56A6;        /* blauw verkeersbord */
  --sign-soft: #DCE6F5;
  --signal: #F2C230;      /* signaalgeel */
  --ok: #1E7A4C;
  --ok-soft: #DAF0E3;
  --bad: #B3261E;
  --bad-soft: #F9DEDC;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121816; --surface: #1C2422; --ink: #EEF1EC; --muted: #A3ADA8; --line: #2F3A37;
    --lane: #E5654C; --lane-soft: #3A211C; --sign: #7FA8EA; --sign-soft: #1B2A42; --signal: #F2C230;
    --ok: #5BC48C; --ok-soft: #173326; --bad: #F08A80; --bad-soft: #3D1D1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121816; --surface: #1C2422; --ink: #EEF1EC; --muted: #A3ADA8; --line: #2F3A37;
  --lane: #E5654C; --lane-soft: #3A211C; --sign: #7FA8EA; --sign-soft: #1B2A42; --signal: #F2C230;
  --ok: #5BC48C; --ok-soft: #173326; --bad: #F08A80; --bad-soft: #3D1D1A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--sign); outline-offset: 3px; }

/* kop */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 6px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-stretch: 85%; letter-spacing: .02em; text-transform: uppercase; font-size: 15px; }
.brand .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--sign); display: grid; place-items: center; }
.brand .dot svg { width: 18px; height: 18px; }
.back { border: 0; background: transparent; padding: 8px 4px; color: var(--muted); cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.back:hover { color: var(--ink); }

/* hero */
.hero { padding-block: 18px 22px; }
.eyebrow { font-family: var(--font-display); font-weight: 700; font-stretch: 100%; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; color: var(--lane); }
h1 { font-family: var(--font-display); font-weight: 900; font-stretch: 72%; text-transform: uppercase; line-height: .92; font-size: clamp(48px, 15vw, 76px); margin: 8px 0 14px; letter-spacing: -.01em; text-wrap: balance; }
h1 .hl { color: var(--lane); }
.lede { color: var(--muted); margin: 0; max-width: 44ch; }

/* fietspad-streep */
.lane-rule { height: 10px; border-radius: 3px; background: var(--lane); position: relative; overflow: hidden; margin-block: 6px 22px; }
.lane-rule::after { content: ""; position: absolute; inset: 4px 0 auto; height: 2px; background: repeating-linear-gradient(90deg, var(--bg) 0 14px, transparent 14px 26px); }

/* voertuigkeuze */
.pick-label { font-family: var(--font-display); font-weight: 800; font-stretch: 90%; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; margin: 0 0 10px; }
.vehicles { display: grid; gap: 10px; }
.vehicle {
  display: grid; grid-template-columns: 84px 1fr auto; align-items: center; gap: 14px;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px 12px 10px;
  transition: border-color .15s, transform .15s;
}
.vehicle:hover { border-color: var(--ink); transform: translateX(3px); }
.vehicle .ico { width: 84px; height: 52px; border-radius: 10px; background: var(--sign-soft); color: var(--sign); display: grid; place-items: center; }
.vehicle .ico svg { width: 70px; height: 42px; }
.vehicle .name { font-family: var(--font-display); font-weight: 800; font-stretch: 85%; font-size: 21px; line-height: 1.1; text-transform: uppercase; display: block; }
.vehicle .sub { color: var(--muted); font-size: 14px; display: block; margin-top: 2px; }
.vehicle .go { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.vehicle .go svg { width: 16px; height: 16px; }
.vehicle .meta { min-width: 0; }
.foot { color: var(--muted); font-size: 13px; margin-top: 26px; }
.foot a { color: inherit; }

/* quiz */
.qhead { display: flex; align-items: center; gap: 12px; padding-block: 12px 4px; }
.qhead .ico { width: 64px; height: 40px; color: var(--sign); flex: none; }
.qhead .ico svg { width: 64px; height: 40px; }
.qhead .t { font-family: var(--font-display); font-weight: 800; font-stretch: 85%; text-transform: uppercase; font-size: 20px; line-height: 1.1; }
.qhead .c { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.progress { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; margin-block: 14px 22px; }
.progress span { height: 8px; border-radius: 2px; background: var(--line); transition: background .25s; }
.progress span.done { background: var(--lane); }
.progress span.now { background: var(--signal); }
.question { font-family: var(--font-display); font-weight: 800; font-stretch: 90%; font-size: clamp(24px, 6.4vw, 30px); line-height: 1.15; margin: 0 0 18px; text-wrap: balance; }
.answers { display: grid; gap: 10px; }
.answer {
  display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center;
  width: 100%; text-align: left; cursor: pointer; font-size: 17px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px;
  transition: border-color .15s, background .15s;
}
.answer:hover:not(:disabled) { border-color: var(--ink); }
.answer .k { width: 34px; height: 34px; border-radius: 8px; background: var(--bg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; }
.answer:disabled { cursor: default; }
.answer.right { border-color: var(--ok); background: var(--ok-soft); }
.answer.right .k { background: var(--ok); color: var(--surface); }
.answer.wrong { border-color: var(--bad); background: var(--bad-soft); }
.answer.wrong .k { background: var(--bad); color: var(--surface); }
.answer.dim { opacity: .55; }
.explain { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--sign-soft); border-left: 6px solid var(--sign); }
.explain strong { display: block; font-family: var(--font-display); font-stretch: 90%; text-transform: uppercase; letter-spacing: .04em; font-size: 14px; margin-bottom: 4px; }
.explain p { margin: 0; }
.cta {
  margin-top: 18px; width: 100%; border: 0; cursor: pointer; border-radius: 12px; padding: 16px 18px;
  background: var(--ink); color: var(--bg); font-family: var(--font-display); font-weight: 800; font-stretch: 90%;
  text-transform: uppercase; letter-spacing: .05em; font-size: 17px; display: flex; justify-content: space-between; align-items: center;
}
.cta.alt { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.cta svg { width: 18px; height: 18px; }

/* resultaat */
.result { padding-block: 10px 0; }
.score { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 10px; }
.score .n { font-family: var(--font-display); font-weight: 900; font-stretch: 70%; font-size: 120px; line-height: .85; color: var(--lane); font-variant-numeric: tabular-nums; }
.score .of { font-family: var(--font-display); font-weight: 800; font-stretch: 80%; font-size: 34px; color: var(--muted); }
.verdict { font-family: var(--font-display); font-weight: 900; font-stretch: 80%; text-transform: uppercase; font-size: 30px; line-height: 1; margin: 0 0 10px; }
.tipbox { margin-top: 18px; padding: 16px; border-radius: 12px; background: var(--surface); border: 2px dashed var(--line); }
.tipbox .eyebrow { color: var(--sign); }
.tipbox p { margin: 6px 0 0; }
.review { margin-top: 22px; display: grid; gap: 8px; }
.review div { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 15px; color: var(--muted); }
.review b { color: var(--ink); font-weight: 700; }
.mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--surface); }
.mark.y { background: var(--ok); } .mark.n { background: var(--bad); }
.copied { font-size: 14px; color: var(--ok); margin-top: 8px; min-height: 1.4em; }

.screen { animation: in .35s ease both; }
@keyframes in { from { transform: translateY(8px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .vehicle, .vehicle:hover { transition: none; transform: none; } }
</style>
</head>

    tip: "Laad zwaar en laag, en controleer het maximale gewicht dat de fabrikant toelaat.",
    q: [
      { q: "Je neemt een kind van 6 jaar mee achterop. Wat is verplicht?", a: ["Niets, als het zich goed vasthoudt", "Een aangepast zitje met voetsteunen", "Alleen een helm"], c: 1,
        x: "Kinderen jonger dan 9 jaar moeten op een aangepast zitje zitten, met bescherming zodat hun voeten niet in de spaken raken." },
      { q: "Waarvoor dienen wielafschermingen op een longtail?", a: ["Voor de looks", "Om te voorkomen dat voeten of kleding in het achterwiel raken", "Om sneller te rijden"], c: 1,
        x: "Wielafschermingen en voetsteunen houden voetjes, sjaals en tassen uit de spaken." },
      { q: "Hoe laad je zware boodschappen?", a: ["Zo hoog mogelijk, dan zie je ze", "Laag en zo centraal mogelijk", "Helemaal achteraan"], c: 1,
        x: "Een laag zwaartepunt houdt je fiets stabiel. Zware spullen gaan laag in de tassen, verdeeld over beide kanten." },
      { q: "Waarom is een brede dubbele standaard handig?", a: ["De fiets blijft stabiel staan terwijl kinderen op- en afstappen", "Hij maakt de fiets lichter", "Hij is verplicht"], c: 0,
        x: "Met een brede standaard valt de fiets niet om als een kind op het zitje klimt of als je laadt." },
      { q: "Je longtail is een stuk langer dan een gewone fiets. Wat betekent dat in het verkeer?", a: ["Niets", "Je achterkant heeft meer ruimte nodig bij inhalen en afslaan", "Je mag niet op het fietspad"], c: 1,
        x: "Houd rekening met je lengte: wacht bij invoegen tot je volledige fiets ruimte heeft en kijk achterom voor je terug naar rechts gaat." },
      { q: "Mag je samen met je passagier zoveel laden als je wil?", a: ["Ja, een longtail kan alles aan", "Nee, houd je aan het maximale totaalgewicht van de fabrikant", "Ja, zolang je stapvoets rijdt"], c: 1,
        x: "Elke longtail heeft een maximaal totaalgewicht voor fietser, passagiers en lading. Daarboven worden remmen en frame overbelast." }
    ]
  }
};

const app = document.getElementById("app");
const backBtn = document.getElementById("backBtn");
let state = null;

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function renderHome() {
  state = null;
  backBtn.hidden = true;
  app.innerHTML = `
    <section class="screen">
      <div class="hero">
        <div class="eyebrow">Mobiliteitsquiz</div>
        <h1>Hoe <span class="hl">fietsfit</span> ben jij?</h1>
        <p class="lede">Kies waarmee je naar hier fietst en test in zes vragen hoe goed je de regels en trucjes voor jouw fiets kent.</p>
      </div>
      <div class="lane-rule" aria-hidden="true"></div>
      <p class="pick-label">Waarmee rijd jij?</p>
      <div class="vehicles">
        ${Object.entries(VEHICLES).map(([id, v]) => `
          <button class="vehicle" data-id="${id}">
            <span class="ico" aria-hidden="true">${ICONS[id]}</span>
            <span class="meta"><span class="name">${v.name}</span><span class="sub">${v.sub}</span></span>
            <span class="go" aria-hidden="true">${ARROW}</span>
          </button>`).join("")}
      </div>
      <p class="foot">Gebaseerd op de Belgische wegcode. Meer info op <a href="https://www.wegcode.be" target="_blank" rel="noopener">wegcode.be</a>.</p>
    </section>`;
  app.querySelectorAll(".vehicle").forEach(b => b.addEventListener("click", () => start(b.dataset.id)));
}

function start(id) {
  state = { id, i: 0, score: 0, answers: [] };
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  backBtn.hidden = false;
  renderQuestion();
  window.scrollTo({ top: 0 });
}

function renderQuestion() {
  const v = VEHICLES[state.id];
  const item = v.q[state.i];
  const total = v.q.length;
  app.innerHTML = `
    <section class="screen">
      <div class="qhead">
        <span class="ico" aria-hidden="true">${ICONS[state.id]}</span>
        <div><div class="t">${v.name}</div><div class="c">Vraag ${state.i + 1} van ${total}</div></div>
      </div>
      <div class="progress" aria-hidden="true">${v.q.map((_, k) => `<span class="${k < state.i ? "done" : k === state.i ? "now" : ""}"></span>`).join("")}</div>
      <h2 class="question">${esc(item.q)}</h2>
      <div class="answers">
        ${item.a.map((t, k) => `<button class="answer" data-k="${k}"><span class="k">${"ABC"[k]}</span><span>${esc(t)}</span></button>`).join("")}
      </div>
      <div id="after"></div>
    </section>`;
  app.querySelectorAll(".answer").forEach(b => b.addEventListener("click", () => choose(+b.dataset.k)));
}

function choose(k) {
  const v = VEHICLES[state.id];
  const item = v.q[state.i];
  const ok = k === item.c;
  if (ok) state.score++;
  state.answers.push(ok);
  app.querySelectorAll(".answer").forEach((b, idx) => {
    b.disabled = true;
    if (idx === item.c) b.classList.add("right");
    else if (idx === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const last = state.i === v.q.length - 1;
  const after = document.getElementById("after");
  after.innerHTML = `
    <div class="explain" role="status"><strong>${ok ? "Juist!" : "Niet helemaal"}</strong><p>${esc(item.x)}</p></div>
    <button class="cta" id="next">${last ? "Bekijk je score" : "Volgende vraag"} ${ARROW}</button>`;
  const next = document.getElementById("next");
  next.addEventListener("click", () => { if (last) renderResult(); else { state.i++; renderQuestion(); } });
  next.focus({ preventScroll: true });
  after.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
}

function renderResult() {
  const v = VEHICLES[state.id];
  const total = v.q.length, s = state.score;
  const verdict = s === total ? "Fietsfit met glans" : s >= total - 2 ? "Goed op weg" : "Nog wat bijtrappen";
  app.innerHTML = `
    <section class="screen result">
      <div class="eyebrow">${v.name} · jouw score</div>
      <div class="score"><span class="n">${s}</span><span class="of">/ ${total}</span></div>
      <p class="verdict">${verdict}</p>
      <div class="lane-rule" aria-hidden="true"></div>
      <div class="tipbox"><div class="eyebrow">Tip voor onderweg</div><p>${esc(v.tip)}</p></div>
      <div class="review">${v.q.map((it, k) => `<div><span class="mark ${state.answers[k] ? "y" : "n"}">${state.answers[k] ? "✓" : "✕"}</span><span><b>${esc(it.q)}</b><br>${esc(it.a[it.c])}</span></div>`).join("")}</div>
      <button class="cta" id="again">Probeer een ander voertuig ${ARROW}</button>
      <button class="cta alt" id="share">Kopieer link naar deze quiz ${ARROW}</button>
      <div class="copied" id="copied" role="status"></div>
    </section>`;
  window.scrollTo({ top: 0 });
  document.getElementById("again").addEventListener("click", goHome);
  document.getElementById("share").addEventListener("click", () => {
    const url = location.href.split("#")[0] + "#" + state.id;
    const msg = document.getElementById("copied");
    navigator.clipboard.writeText(url).then(() => { msg.textContent = "Link gekopieerd."; }).catch(() => { msg.textContent = url; });
  });
}

function goHome() {
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  renderHome();
  window.scrollTo({ top: 0 });
}
backBtn.addEventListener("click", goHome);

const initial = (location.hash || "").slice(1);
if (VEHICLES[initial]) start(initial); else renderHome();
</script>

</body>
</html>
